schema: spec-driven

context: |
  Cuadre: app web de control de gastos e ingresos (proyecto final AI4Devs). Solo el MVP de readme.md.
  Stack: Next.js 16 (App Router) + TypeScript + Prisma 7.10.0 + PostgreSQL local en Docker. Windows.
  Capas: Prisma solo en src/server/repositories; validación con Zod en el servidor; componentes sin acceso a datos.
  Dominio en español (Usuario, Cuenta, Categoria, Transaccion). Dinero como Decimal. Toda consulta filtra por usuarioId.
  Tests: Vitest + Testing Library + jsdom (unidades y componentes) y Playwright (E2E), a configurar en el change setup-testing.
  Las reglas de trabajo están en AGENTS.md; no las repitas en los artefactos.
  Idioma de los artefactos: español.

rules:
  proposal:
    - Máximo 400 palabras.
    - Incluir una sección "Fuera de alcance".
    - Indicar qué specs existentes se ven afectadas.
    - Si el change necesita una dependencia nueva, nombrarla y confirmar que está en la lista aprobada de AGENTS.md.
  specs:
    - Cada requirement tiene al menos un escenario GIVEN/WHEN/THEN verificable con un test automático.
    - Cada escenario tiene un nombre único; ese nombre será el nombre exacto del test.
    - Toda capacidad que maneje datos de usuario incluye un escenario que verifique que un usuario no puede ver ni modificar datos de otro.
    - Los escenarios con montos usan valores decimales concretos (por ejemplo 10.50), nunca aproximados.
  design:
    - Solo decisiones que afecten a varios archivos o que no sean obvias. Máximo una página.
    - Respetar las capas de AGENTS.md (repositories, validación con Zod, componentes).
    - Todo cambio de schema implica una migración nueva y ejecutar prisma generate.
    - El primer change que toque la base de datos debe decidir y documentar la estrategia de tests de datos (repositorios simulados o base de datos de prueba separada).
  tasks:
    - Agrupar las tareas por escenario de la spec.
    - Cada escenario genera tres subtareas en este orden, RED (test que falla, con archivo de test y nombre exacto del escenario), GREEN (mínimo código, con archivo) y REFACTOR.
    - Si se toca código existente sin tests, añadir antes una subtarea CARACTERIZACIÓN que capture el comportamiento actual.
    - Las tareas de migración incluyen ejecutar prisma generate.
    - La última tarea del change ejecuta lint, comprobación de tipos, suite completa de tests y openspec validate --strict.
    - "Toda tarea que cree una migración de Prisma se marca [HUMANO]: la persona la genera con migrate dev --create-only, la revisa y la aplica; el agente se detiene antes."

operations:
  apply:
    guidance:
      - Antes de empezar, confirma que la rama actual es final-project-NCH. Si es main, detente y avisa.
      - Implementa una sola subtarea a la vez, en orden RED, GREEN, REFACTOR. Nunca escribas código de producción sin haber visto fallar su test.
      - Si el RED no puede observarse de forma natural (por ejemplo, porque el entorno ya cumple la condición), detente y propón cómo forzarlo antes de continuar.
      - Si un GREEN introduce varias piezas independientes y el RED solo demostró la necesidad de una, verifica cada pieza por mutación (retírala temporalmente, confirma que un test falla y restáurala), sin commit.
      - Ejecuta solo el archivo de test afectado con npx vitest run <archivo> --reporter=dot. La suite completa solo al cerrar un grupo.
      - Si en RED el test falla por un motivo distinto al esperado, detente y explícalo.
      - No modifiques un test existente para que pase sin justificarlo y pedir confirmación.
      - "progress.md se reescribe completo (nunca se añade al final) con este formato exacto y nada más, un elemento de lista por campo: '# Progreso: <change>', '- Siguiente: <próxima tarea>', '- Decisiones: <máximo 3, una línea cada una, solo lo necesario para continuar>', '- Discrepancias: <lista o ninguna>'. No copies casillas ni conteos de tasks.md, ni fechas ni quién decidió: eso va en proposal.md o design.md."
      - Si una decisión cambia el plan, actualiza también design.md o tasks.md; progress.md solo la resume.
      - El test, la casilla marcada en tasks.md y progress.md actualizado van en el mismo commit. Si un REFACTOR no produce cambios, márcalo en el mismo commit que su GREEN.
      - Al terminar cada grupo, detente con un resumen de máximo 5 líneas que indique, por cada test, el motivo del fallo visto en RED.
      - Al retomar un change, lee primero progress.md y tasks.md, y nada más hasta que una tarea lo requiera.
      - Antes de detenerte al final de un grupo, comprueba que todas las subtareas realizadas de ese grupo están marcadas con [x] en tasks.md; si falta alguna, márcala en el mismo commit.
      - "Con el hook de pre-commit ejecutando la suite completa, el RED no se commitea solo: ejecuta el test, confirma que falla por la razón esperada, anota el motivo en progress.md y haz un único commit con el test y su GREEN en verde."
  archive:
    guidance:
      - Si no hay constancia de que se ejecutó /opsx:verify para este change, pregunta antes de archivar.
      - Antes de archivar, ejecuta npm run lint, npx tsc --noEmit y npx vitest run --reporter=dot. Si alguno falla, detente.
      - Comprueba con una búsqueda en el código que cada escenario de los deltas tiene un test cuyo nombre coincide exactamente. Lista los que falten y detente.
      - Si el change tiene skip_specs, no modifiques nada en openspec/specs/.
      - Resume el resultado del archivo en máximo 5 líneas.